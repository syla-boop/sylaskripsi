<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Syla's Skripsi Workspace</title>
    <style>
        /* === ADVANCED CSS SYSTEM === */
        :root {
            --primary: #4361ee; --primary-hover: #3a0ca3;
            --bg-body: #f4f7fe; --bg-card: #ffffff;
            --text-main: #2b3674; --text-muted: #a3aed1;
            --border: #e2e8f0; --danger: #ef476f; --success: #06d6a0;
            --shadow: 0 10px 20px rgba(0,0,0,0.05);
            --radius: 16px;
        }
        [data-theme="dark"] {
            --bg-body: #0b1437; --bg-card: #111c44;
            --text-main: #ffffff; --text-muted: #8f9bba;
            --border: #2b3674; --shadow: 0 10px 20px rgba(0,0,0,0.4);
        }
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; transition: background 0.3s, color 0.3s; margin: 0; padding: 0; }
        body { background: var(--bg-body); color: var(--text-main); padding-bottom: 80px; }
        
        /* Layout */
        .header { display: flex; justify-content: space-between; align-items: center; padding: 20px; background: var(--bg-card); box-shadow: var(--shadow); position: sticky; top: 0; z-index: 10; }
        .header h1 { font-size: 20px; font-weight: 800; background: linear-gradient(to right, var(--primary), #4cc9f0); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .controls { display: flex; gap: 10px; }
        
        .container { max-width: 1200px; margin: 20px auto; padding: 0 20px; }
        
        /* Search Bar */
        .search-container { display: none; margin-bottom: 20px; animation: fadeIn 0.4s; }
        .search-container input { width: 100%; border-radius: 20px; padding: 14px 20px; box-shadow: var(--shadow); border: 1px solid var(--border); font-size: 15px; }
        
        /* Buttons */
        button { border: none; border-radius: 8px; cursor: pointer; font-weight: 600; padding: 10px 16px; font-size: 14px; display: flex; align-items: center; gap: 8px; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-outline { background: transparent; border: 2px solid var(--primary); color: var(--primary); }
        .btn-danger { background: var(--danger); color: white; padding: 6px 12px; font-size: 12px; }
        .btn-icon { padding: 8px; border-radius: 50%; width: 40px; height: 40px; display: flex; justify-content: center; align-items: center; background: var(--bg-body); color: var(--text-main); }
        
        /* Tabs Nav */
        .nav-tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid var(--border); padding-bottom: 10px; overflow-x: auto; }
        .tab { padding: 10px 20px; color: var(--text-muted); cursor: pointer; font-weight: 600; border-radius: var(--radius); white-space: nowrap; }
        .tab.active { background: var(--primary); color: white; }
        
        .content-section { display: none; animation: fadeIn 0.4s; }
        .content-section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Dashboard Cards */
        .dash-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .dash-card { background: var(--bg-card); padding: 24px; border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid var(--border); }
        .dash-card h3 { color: var(--text-muted); font-size: 14px; margin-bottom: 10px; }
        .dash-card h2 { font-size: 36px; color: var(--primary); }

        /* Grid Item Cards */
        .item-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        .data-card { background: var(--bg-card); padding: 20px; border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid var(--border); position: relative; }
        .badge { position: absolute; top: 20px; right: 20px; background: var(--bg-body); padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; color: var(--primary); }
        .data-card h4 { margin: 10px 0 5px; font-size: 16px; padding-right: 60px; line-height: 1.4; }
        .data-card p { font-size: 14px; color: var(--text-muted); margin-bottom: 15px; line-height: 1.5; }
        .quote-box { background: var(--bg-body); border-left: 4px solid var(--primary); padding: 12px; border-radius: 4px 8px 8px 4px; font-size: 13px; font-style: italic; margin-bottom: 15px; }

        /* Modal */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 100; backdrop-filter: blur(4px); }
        .modal { background: var(--bg-card); width: 90%; max-width: 600px; border-radius: var(--radius); padding: 30px; box-shadow: 0 25px 50px rgba(0,0,0,0.25); max-height: 90vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 5px; font-weight: 600; }
        input[type="text"], select, textarea { width: 100%; padding: 12px; border: 2px solid var(--border); border-radius: 8px; background: var(--bg-body); color: var(--text-main); font-size: 14px; outline: none; }
        input:focus, select:focus, textarea:focus { border-color: var(--primary); }
        textarea { height: 100px; resize: none; }
        
        /* FAB */
        .fab { position: fixed; bottom: 30px; right: 30px; width: 60px; height: 60px; background: var(--primary); color: white; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 30px; box-shadow: 0 10px 25px rgba(67, 97, 238, 0.5); border: none; cursor: pointer; z-index: 50; transition: transform 0.2s; }
        .fab:active { transform: scale(0.95); }

        /* Toast */
        .toast { position: fixed; bottom: -100px; left: 50%; transform: translateX(-50%); background: var(--success); color: white; padding: 12px 24px; border-radius: 30px; font-weight: bold; transition: bottom 0.4s; z-index: 1000; box-shadow: var(--shadow); }
        
        /* Attachment Button */
        .btn-attach { padding: 10px; border: 2px solid var(--border); border-radius: 8px; background: var(--bg-body); cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; transition: 0.3s; }
        .btn-attach:hover { border-color: var(--primary); }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="header">
        <h1>Syla's Skripsi App</h1>
        <div class="controls">
            <button type="button" class="btn-icon" onclick="toggleTheme()" title="Mode Gelap/Terang">🌓</button>
            <button type="button" class="btn-outline" onclick="document.getElementById('importFile').click()" title="Restore Data">📂</button>
            <input type="file" id="importFile" style="display:none" onchange="importJSON(event)" accept=".json">
            <button type="button" class="btn-primary" onclick="exportJSON()" title="Backup Data">💾 Backup</button>
        </div>
    </header>

    <div class="container">
        <!-- Navigation Tabs -->
        <div class="nav-tabs">
            <div class="tab active" onclick="switchTab('dashboard')">📊 Dashboard</div>
            <div class="tab" onclick="switchTab('literatur')">📚 Jurnal (Bab 2)</div>
            <div class="tab" onclick="switchTab('indikator')">🎯 Indikator (SmartPLS)</div>
        </div>

        <div class="search-container" id="search-box">
            <input type="text" id="searchInput" placeholder="🔍 Cari nama judul, penulis, variabel, atau kata kunci..." onkeyup="renderData()">
        </div>

        <!-- Dashboard Section -->
        <div id="dashboard" class="content-section active">
            <div class="dash-grid">
                <div class="dash-card">
                    <h3>Total Jurnal Disintesis</h3>
                    <h2 id="countLit">0</h2>
                </div>
                <div class="dash-card">
                    <h3>Indikator Kuesioner (Outer Model)</h3>
                    <h2 id="countInd">0</h2>
                    <button type="button" class="btn-primary" style="margin-top:15px; width:100%; justify-content:center;" onclick="exportCSV()">📥 Export ke SmartPLS</button>
                </div>
            </div>
            
            <!-- ADVANCED QUICK NOTES / VISUAL DATABASE -->
            <div class="dash-card">
                <h3>💡 Visual Notes & Tasks</h3>
                <p style="font-size:12px; color:var(--text-muted); margin-bottom:15px;">Catat ide, tugas, atau lampirkan gambar/screenshot materi penting.</p>
                
                <!-- Form Input Area yang Bener (Biar bisa di-Enter) -->
                <form onsubmit="addNote(event)" style="display:flex; gap:10px; margin-bottom:10px; flex-wrap:wrap; align-items:center;">
                    <select id="note-type" style="padding:10px; border:2px solid var(--border); border-radius:8px; background:var(--bg-body); color:var(--text-main); font-weight:bold; outline:none; cursor:pointer;">
                        <option value="task">☑️ Task</option>
                        <option value="note">📌 Note</option>
                    </select>
                    <select id="note-mark" style="padding:10px; border:2px solid var(--border); border-radius:8px; background:var(--bg-body); color:var(--text-main); font-weight:bold; outline:none; cursor:pointer;">
                        <option value="🎯 Target">🎯 Target</option>
                        <option value="🔥 Urgent">🔥 Urgent</option>
                        <option value="📝 Revisi">📝 Revisi</option>
                        <option value="💡 Ide">💡 Ide</option>
                        <option value="🖼️ Gambar">🖼️ Gambar</option>
                    </select>
                    <input type="text" id="note-input" placeholder="Ketik catatan di sini..." style="flex:1; min-width:150px;">
                    
                    <label class="btn-attach" title="Lampirkan Gambar">
                        🖼️ <input type="file" id="note-image" accept="image/*" style="display:none;" onchange="handleImageSelect(event)">
                    </label>
                    
                    <button type="submit" class="btn-primary">Tambah</button>
                </form>

                <!-- Preview Gambar Sebelum Upload -->
                <div id="image-preview-container" style="display:none; position:relative; margin-bottom:20px; width:max-content;">
                    <img id="preview-img" src="" style="max-height:120px; border-radius:8px; border:2px solid var(--primary);">
                    <button type="button" onclick="clearImagePreview()" style="position:absolute; top:-10px; right:-10px; background:var(--danger); color:white; border-radius:50%; width:24px; height:24px; border:none; font-weight:bold; cursor:pointer; box-shadow:var(--shadow);">X</button>
                </div>

                <!-- Notes Container -->
                <div id="notes-container" style="display:flex; flex-direction:column; gap:12px; max-height: 500px; overflow-y: auto; padding-right: 5px;">
                    <!-- Notes render here via JS -->
                </div>
            </div>
        </div>

        <!-- Literatur Section -->
        <div id="literatur" class="content-section">
            <div class="item-grid" id="lit-grid"></div>
        </div>

        <!-- Indikator Section -->
        <div id="indikator" class="content-section">
            <div class="item-grid" id="ind-grid"></div>
        </div>
    </div>

    <!-- Floating Action Button -->
    <button type="button" class="fab" onclick="openModal()">+</button>

    <!-- Modal Form Tambah Data yang Bener -->
    <div class="modal-overlay" id="modal">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modal-title" style="font-size:18px;">Tambah Data</h2>
                <button type="button" class="btn-icon" onclick="closeModal()">✕</button>
            </div>
            
            <form id="mainDataForm" onsubmit="saveData(event)">
                <div id="form-container"></div>
                <button type="submit" class="btn-primary" style="width:100%; justify-content:center; margin-top:20px;">Simpan Data</button>
            </form>
            
        </div>
    </div>

    <div class="toast" id="toast">✅ Sukses!</div>

    <script>
        // === 🛡️ ADVANCED DATABASE SYSTEM ===
        const DB_KEY_LIT = 'syla_lit_master';
        const DB_KEY_IND = 'syla_ind_master';
        const DB_KEY_NOTES = 'syla_quick_notes_v3';

        let currentNoteImageBase64 = null; 

        function loadDatabase(key) {
            try {
                const data = localStorage.getItem(key);
                return data ? JSON.parse(data) : [];
            } catch (error) { return []; }
        }

        function saveToDatabase(key, data) {
            try {
                localStorage.setItem(key, JSON.stringify(data));
                return true;
            } catch (error) {
                alert("⚠️ Peringatan: Memori browser penuh! Hapus beberapa gambar lama atau klik Backup sekarang.");
                return false;
            }
        }

        let currentTab = 'dashboard';
        let db = {
            literatur: loadDatabase(DB_KEY_LIT),
            indikator: loadDatabase(DB_KEY_IND),
            notes: loadDatabase(DB_KEY_NOTES)
        };

        // === UI FUNCTIONS ===
        function toggleTheme() {
            const html = document.documentElement;
            html.setAttribute('data-theme', html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.content-section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
            document.getElementById(tab).classList.add('active');
            
            const tabs = document.querySelectorAll('.tab');
            if(tab === 'dashboard') tabs[0].classList.add('active');
            else if(tab === 'literatur') tabs[1].classList.add('active');
            else if(tab === 'indikator') tabs[2].classList.add('active');
            
            document.querySelector('.fab').style.display = tab === 'dashboard' ? 'none' : 'flex';
            document.getElementById('search-box').style.display = tab === 'dashboard' ? 'none' : 'block';
            
            document.getElementById('searchInput').value = '';
            renderData();
        }

        function showToast(msg, isError = false) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.style.background = isError ? 'var(--danger)' : 'var(--success)';
            toast.style.bottom = '30px';
            setTimeout(() => toast.style.bottom = '-100px', 3000);
        }

        // === 🖼️ IMAGE COMPRESSION SYSTEM ===
        function handleImageSelect(event) {
            const file = event.target.files[0];
            if(!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.src = e.target.result;
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 800; 
                    let width = img.width;
                    let height = img.height;

                    if (width > MAX_WIDTH) {
                        height = Math.round((height * MAX_WIDTH) / width);
                        width = MAX_WIDTH;
                    }
                    canvas.width = width;
                    canvas.height = height;
                    
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    currentNoteImageBase64 = canvas.toDataURL('image/jpeg', 0.7);
                    document.getElementById('preview-img').src = currentNoteImageBase64;
                    document.getElementById('image-preview-container').style.display = 'block';
                };
            };
            reader.readAsDataURL(file);
        }

        function clearImagePreview() {
            currentNoteImageBase64 = null;
            document.getElementById('note-image').value = '';
            document.getElementById('image-preview-container').style.display = 'none';
        }

        // === 📝 TASK & QUICK NOTES LOGIC ===
        function addNote(event) {
            if(event) event.preventDefault(); // SUPER PENTING: Biar ga reload pas submit
            
            const text = document.getElementById('note-input').value.trim();
            if(!text && !currentNoteImageBase64) return; 
            
            const mark = document.getElementById('note-mark').value;
            const type = document.getElementById('note-type').value;
            
            db.notes.unshift({ 
                id: Date.now(), 
                type: type, 
                mark: mark, 
                text: text || "Lampiran Gambar", 
                image: currentNoteImageBase64,
                isDone: false 
            });
            
            if(saveToDatabase(DB_KEY_NOTES, db.notes)) {
                document.getElementById('note-input').value = '';
                clearImagePreview();
                renderNotes();
            }
        }

        function toggleNote(id) {
            const note = db.notes.find(n => n.id === id);
            if(note && note.type !== 'note') { 
                note.isDone = !note.isDone;
                saveToDatabase(DB_KEY_NOTES, db.notes);
                renderNotes();
            }
        }

        function deleteNote(id) {
            if(confirm("Yakin mau hapus catatan/gambar ini?")) {
                db.notes = db.notes.filter(n => n.id !== id);
                saveToDatabase(DB_KEY_NOTES, db.notes);
                renderNotes();
            }
        }

        function getMarkColor(mark) {
            if(mark.includes('Target')) return 'var(--success)'; 
            if(mark.includes('Urgent')) return 'var(--danger)'; 
            if(mark.includes('Revisi')) return '#f7b801'; 
            if(mark.includes('Ide')) return '#4cc9f0'; 
            return 'var(--primary)';
        }

        function renderNotes() {
            const container = document.getElementById('notes-container');
            if (db.notes.length === 0) {
                container.innerHTML = `<p style="text-align:center; color:var(--text-muted); font-size:13px; margin-top:10px;">Yey! Belum ada task atau catatan gambar baru.</p>`;
                return;
            }
            
            container.innerHTML = db.notes.map(note => {
                const isTask = note.type !== 'note'; 
                const imgElement = note.image ? `<img src="${note.image}" style="max-width:100%; max-height:250px; border-radius:8px; margin-top:10px; border:1px solid var(--border); object-fit:contain; display:block;">` : '';

                return `
                <div style="background:var(--bg-body); padding:16px; border-radius:10px; display:flex; justify-content:space-between; align-items:flex-start; border-left:4px solid ${getMarkColor(note.mark)}; opacity: ${note.isDone && isTask ? '0.6' : '1'}; transition: 0.3s; box-shadow: 0 2px 5px rgba(0,0,0,0.02);">
                    <div style="display:flex; align-items:flex-start; gap:15px; flex:1; overflow:hidde
