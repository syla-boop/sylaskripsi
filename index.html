<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Syla's Skripsi Workspace</title>
    <style>
        /* === ADVANCED CSS SYSTEM === */
        :root {
            --primary: #4361ee; --primary-hover: #3a0ca3;
            --bg-body: #f4f7fe; --bg-card: #ffffff;
            --text-main: #2b3674; --text-muted: #a3aed1;
            --border: #e2e8f0; --danger: #ef476f; --success: #06d6a0;
            --shadow: 0 10px 20px rgba(0,0,0,0.05);
            --radius: 16px;
        }
        [data-theme="dark"] {
            --bg-body: #0b1437; --bg-card: #111c44;
            --text-main: #ffffff; --text-muted: #8f9bba;
            --border: #2b3674; --shadow: 0 10px 20px rgba(0,0,0,0.4);
        }
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; transition: background 0.3s, color 0.3s; margin: 0; padding: 0; }
        body { background: var(--bg-body); color: var(--text-main); padding-bottom: 80px; }
        
        /* Layout */
        .header { display: flex; justify-content: space-between; align-items: center; padding: 20px; background: var(--bg-card); box-shadow: var(--shadow); position: sticky; top: 0; z-index: 10; }
        .header h1 { font-size: 20px; font-weight: 800; background: linear-gradient(to right, var(--primary), #4cc9f0); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .controls { display: flex; gap: 10px; }
        
        .container { max-width: 1200px; margin: 20px auto; padding: 0 20px; }
        
        /* Search Bar */
        .search-container { display: none; margin-bottom: 20px; animation: fadeIn 0.4s; }
        .search-container input { width: 100%; border-radius: 20px; padding: 14px 20px; box-shadow: var(--shadow); border: 1px solid var(--border); font-size: 15px; }
        
        /* Buttons */
        button { border: none; border-radius: 8px; cursor: pointer; font-weight: 600; padding: 10px 16px; font-size: 14px; display: flex; align-items: center; gap: 8px; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-outline { background: transparent; border: 2px solid var(--primary); color: var(--primary); }
        .btn-danger { background: var(--danger); color: white; padding: 6px 12px; font-size: 12px; }
        .btn-icon { padding: 8px; border-radius: 50%; width: 40px; height: 40px; display: flex; justify-content: center; align-items: center; background: var(--bg-body); color: var(--text-main); }
        
        /* Tabs Nav */
        .nav-tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid var(--border); padding-bottom: 10px; overflow-x: auto; }
        .tab { padding: 10px 20px; color: var(--text-muted); cursor: pointer; font-weight: 600; border-radius: var(--radius); white-space: nowrap; }
        .tab.active { background: var(--primary); color: white; }
        
        .content-section { display: none; animation: fadeIn 0.4s; }
        .content-section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Dashboard Cards */
        .dash-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .dash-card { background: var(--bg-card); padding: 24px; border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid var(--border); }
        .dash-card h3 { color: var(--text-muted); font-size: 14px; margin-bottom: 10px; }
        .dash-card h2 { font-size: 36px; color: var(--primary); }

        /* Grid Item Cards */
        .item-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        .data-card { background: var(--bg-card); padding: 20px; border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid var(--border); position: relative; }
        .badge { position: absolute; top: 20px; right: 20px; background: var(--bg-body); padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; color: var(--primary); }
        .data-card h4 { margin: 10px 0 5px; font-size: 16px; padding-right: 60px;}
        .data-card p { font-size: 14px; color: var(--text-muted); margin-bottom: 15px; line-height: 1.5; }
        .quote-box { background: var(--bg-body); border-left: 4px solid var(--primary); padding: 12px; border-radius: 4px 8px 8px 4px; font-size: 13px; font-style: italic; margin-bottom: 15px; }

        /* Modal */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 100; backdrop-filter: blur(4px); }
        .modal { background: var(--bg-card); width: 90%; max-width: 600px; border-radius: var(--radius); padding: 30px; box-shadow: 0 25px 50px rgba(0,0,0,0.25); max-height: 90vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 5px; font-weight: 600; }
        input, select, textarea { width: 100%; padding: 12px; border: 2px solid var(--border); border-radius: 8px; background: var(--bg-body); color: var(--text-main); font-size: 14px; outline: none; }
        input:focus, select:focus, textarea:focus { border-color: var(--primary); }
        textarea { height: 100px; resize: none; }
        
        /* FAB */
        .fab { position: fixed; bottom: 30px; right: 30px; width: 60px; height: 60px; background: var(--primary); color: white; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 30px; box-shadow: 0 10px 25px rgba(67, 97, 238, 0.5); border: none; cursor: pointer; z-index: 50; transition: transform 0.2s; }
        .fab:active { transform: scale(0.95); }

        /* Toast */
        .toast { position: fixed; bottom: -100px; left: 50%; transform: translateX(-50%); background: var(--success); color: white; padding: 12px 24px; border-radius: 30px; font-weight: bold; transition: bottom 0.4s; z-index: 1000; box-shadow: var(--shadow); }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="header">
        <h1>Syla's Skripsi App</h1>
        <div class="controls">
            <button class="btn-icon" onclick="toggleTheme()" title="Mode Gelap/Terang">🌓</button>
            <button class="btn-outline" onclick="document.getElementById('importFile').click()" title="Restore Data">📂</button>
            <input type="file" id="importFile" style="display:none" onchange="importJSON(event)" accept=".json">
            <button class="btn-primary" onclick="exportJSON()" title="Backup Data">💾 Backup</button>
        </div>
    </header>

    <div class="container">
        <!-- Navigation Tabs -->
        <div class="nav-tabs">
            <div class="tab active" onclick="switchTab('dashboard')">📊 Dashboard</div>
            <div class="tab" onclick="switchTab('literatur')">📚 Jurnal</div>
            <div class="tab" onclick="switchTab('indikator')">🎯 Indikator (SmartPLS)</div>
        </div>

        <div class="search-container" id="search-box">
            <input type="text" id="searchInput" placeholder="🔍 Cari nama penulis, variabel, atau kata kunci kutipan..." onkeyup="renderData()">
        </div>

        <!-- Dashboard Section -->
        <div id="dashboard" class="content-section active">
            <div class="dash-grid">
                <div class="dash-card">
                    <h3>Total Jurnal Disintesis</h3>
                    <h2 id="countLit">0</h2>
                </div>
                <div class="dash-card">
                    <h3>Indikator Kuesioner (Outer Model)</h3>
                    <h2 id="countInd">0</h2>
                    <button class="btn-primary" style="margin-top:15px; width:100%; justify-content:center;" onclick="exportCSV()">📥 Export ke SmartPLS</button>
                </div>
            </div>
            
            <!-- ADVANCED QUICK NOTES / TO-DO LIST -->
            <div class="dash-card">
                <h3>💡 Task & Quick Notes</h3>
                <p style="font-size:12px; color:var(--text-muted); margin-bottom:15px;">Catat revisi dosen, target hari ini, atau ide mendadak lu di sini.</p>
                
                <!-- Input Area -->
                <div style="display:flex; gap:10px; margin-bottom:20px; flex-wrap:wrap;">
                    <select id="note-mark" style="width:auto; padding:10px; border:2px solid var(--border); border-radius:8px; background:var(--bg-body); color:var(--text-main); font-weight:bold; outline:none; cursor:pointer;">
                        <option value="🎯 Target">🎯 Target</option>
                        <option value="🔥 Urgent">🔥 Urgent</option>
                        <option value="📝 Revisi">📝 Revisi</option>
                        <option value="💡 Ide">💡 Ide</option>
                    </select>
                    <input type="text" id="note-input" placeholder="Ketik tugas atau pesan dospem di sini..." style="flex:1; padding:10px; border:2px solid var(--border); border-radius:8px; background:var(--bg-body); color:var(--text-main); outline:none;" onkeypress="if(event.key==='Enter') addNote()">
                    <button class="btn-primary" onclick="addNote()">Tambah</button>
                </div>

                <!-- Notes Container -->
                <div id="notes-container" style="display:flex; flex-direction:column; gap:12px; max-height: 400px; overflow-y: auto; padding-right: 5px;">
                    <!-- Notes render here via JS -->
                </div>
            </div>
        </div>

        <!-- Literatur Section -->
        <div id="literatur" class="content-section">
            <div class="item-grid" id="lit-grid"></div>
        </div>

        <!-- Indikator Section -->
        <div id="indikator" class="content-section">
            <div class="item-grid" id="ind-grid"></div>
        </div>
    </div>

    <!-- Floating Action Button -->
    <button class="fab" onclick="openModal()">+</button>

    <!-- Modal Form Tambah Data -->
    <div class="modal-overlay" id="modal">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modal-title" style="font-size:18px;">Tambah Data</h2>
                <button class="btn-icon" onclick="closeModal()">✕</button>
            </div>
            <div id="form-container"></div>
            <button class="btn-primary" style="width:100%; justify-content:center; margin-top:20px;" onclick="saveData()">Simpan Data</button>
        </div>
    </div>

    <div class="toast" id="toast">✅ Sukses!</div>

    <script>
        // === 🛡️ ADVANCED DATABASE SYSTEM ===
        const DB_KEY_LIT = 'syla_lit_master';
        const DB_KEY_IND = 'syla_ind_master';
        const DB_KEY_NOTES = 'syla_quick_notes_v2'; // Key baru biar ga error sama yg lama

        function loadDatabase(key) {
            try {
                const data = localStorage.getItem(key);
                return data ? JSON.parse(data) : [];
            } catch (error) { return []; }
        }

        function saveToDatabase(key, data) {
            try {
                localStorage.setItem(key, JSON.stringify(data));
                return true;
            } catch (error) {
                alert("⚠️ Peringatan: Memori browser penuh atau akses diblokir! Klik Backup sekarang.");
                return false;
            }
        }

        let currentTab = 'dashboard';
        let db = {
            literatur: loadDatabase(DB_KEY_LIT),
            indikator: loadDatabase(DB_KEY_IND),
            notes: loadDatabase(DB_KEY_NOTES)
        };

        // Jika baru pertama kali pakai, kasih note contoh
        if(db.notes.length === 0) {
            db.notes.push({ id: 1, mark: '💡 Ide', text: 'Reminder: Prospect Theory digabung ke TCT.', isDone: false });
            saveToDatabase(DB_KEY_NOTES, db.notes);
        }

        // === UI FUNCTIONS ===
        function toggleTheme() {
            const html = document.documentElement;
            html.setAttribute('data-theme', html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.content-section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
            document.getElementById(tab).classList.add('active');
            
            const tabs = document.querySelectorAll('.tab');
            if(tab === 'dashboard') tabs[0].classList.add('active');
            else if(tab === 'literatur') tabs[1].classList.add('active');
            else if(tab === 'indikator') tabs[2].classList.add('active');
            
            document.querySelector('.fab').style.display = tab === 'dashboard' ? 'none' : 'flex';
            document.getElementById('search-box').style.display = tab === 'dashboard' ? 'none' : 'block';
            
            document.getElementById('searchInput').value = '';
            renderData();
        }

        function showToast(msg, isError = false) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.style.background = isError ? 'var(--danger)' : 'var(--success)';
            toast.style.bottom = '30px';
            setTimeout(() => toast.style.bottom = '-100px', 3000);
        }

        // === 📝 TASK & QUICK NOTES LOGIC ===
        function addNote() {
            const text = document.getElementById('note-input').value.trim();
            if(!text) return;
            
            const mark = document.getElementById('note-mark').value;
            db.notes.unshift({ id: Date.now(), mark: mark, text: text, isDone: false });
            
            saveToDatabase(DB_KEY_NOTES, db.notes);
            document.getElementById('note-input').value = '';
            renderNotes();
        }

        function toggleNote(id) {
            const note = db.notes.find(n => n.id === id);
            if(note) {
                note.isDone = !note.isDone;
                saveToDatabase(DB_KEY_NOTES, db.notes);
                renderNotes();
            }
        }

        function editNote(id) {
            const note = db.notes.find(n => n.id === id);
            if(!note) return;
            
            const newText = prompt("Edit catatan skripsi:", note.text);
            if(newText !== null && newText.trim() !== "") {
                note.text = newText.trim();
                saveToDatabase(DB_KEY_NOTES, db.notes);
                renderNotes();
            }
        }

        function deleteNote(id) {
            if(confirm("Yakin mau hapus catatan ini?")) {
                db.notes = db.notes.filter(n => n.id !== id);
                saveToDatabase(DB_KEY_NOTES, db.notes);
                renderNotes();
            }
        }

        function getMarkColor(mark) {
            if(mark.includes('Target')) return 'var(--success)'; // Green
            if(mark.includes('Urgent')) return 'var(--danger)'; // Red
            if(mark.includes('Revisi')) return '#f7b801'; // Yellow
            if(mark.includes('Ide')) return '#4cc9f0'; // Blue
            return 'var(--primary)';
        }

        function renderNotes() {
            const container = document.getElementById('notes-container');
            if (db.notes.length === 0) {
                container.innerHTML = `<p style="text-align:center; color:var(--text-muted); font-size:13px; margin-top:10px;">Yey! Belum ada task atau catatan baru.</p>`;
                return;
            }
            
            container.innerHTML = db.notes.map(note => `
                <div style="background:var(--bg-body); padding:12px 15px; border-radius:10px; display:flex; justify-content:space-between; align-items:center; border-left:4px solid ${getMarkColor(note.mark)}; opacity: ${note.isDone ? '0.6' : '1'}; transition: 0.3s; box-shadow: 0 2px 5px rgba(0,0,0,0.02);">
                    <div style="display:flex; align-items:center; gap:15px; flex:1;">
                        <input type="checkbox" ${note.isDone ? 'checked' : ''} onchange="toggleNote(${note.id})" style="width:20px; height:20px; cursor:pointer; accent-color:var(--primary);">
                        <div style="display:flex; flex-direction:column; gap:4px;">
                            <span style="font-size:11px; font-weight:800; color:var(--text-muted); text-transform:uppercase;">${note.mark}</span>
                            <span style="font-size:14px; font-weight:500; text-decoration:${note.isDone ? 'line-through' : 'none'}; color:${note.isDone ? 'var(--text-muted)' : 'var(--text-main)'}; cursor:pointer;" onclick="toggleNote(${note.id})">${note.text}</span>
                        </div>
                    </div>
                    <div style="display:flex; gap:8px;">
                        <button onclick="editNote(${note.id})" style="background:var(--bg-card); border:1px solid var(--border); padding:6px; border-radius:6px; cursor:pointer; color:var(--text-main); font-size:12px; box-shadow:var(--shadow);" title="Edit">✏️</button>
                        <button onclick="deleteNote(${note.id})" style="background:var(--danger); border:none; padding:6px; border-radius:6px; cursor:pointer; color:white; font-size:12px; box-shadow:var(--shadow);" title="Hapus">🗑️</button>
                    </div>
                </div>
            `).join('');
        }

        // === MODAL & FORMS ===
        function openModal() {
            const container = document.getElementById('form-container');
            const title = document.getElementById('modal-title');
            container.innerHTML = ''; 

            if (currentTab === 'literatur') {
                title.innerText = '📚 Tambah Sintesis Jurnal';
                container.innerHTML = `
                    <div class="form-group"><label>Penulis & Tahun</label><input type="text" id="inp-penulis" placeholder="Contoh: Kahneman & Tversky (1979)" required></div>
                    <div class="form-group"><label>Fokus Variabel / Konstruk</label><input type="text" id="inp-var" placeholder="Contoh: Loss Aversion" required></div>
                    <div class="form-group"><label>Kutipan PDF Asli</label><textarea id="inp-kutipan" placeholder="Paste bahasa Inggrisnya di sini..."></textarea></div>
                    <div class="form-group"><label>Ide / Posisi di Bab 2</label><textarea id="inp-ide" placeholder="Contoh: Buat transisi ke TCT..."></textarea></div>
                `;
            } else if (currentTab === 'indikator') {
                title.innerText = '🎯 Tambah Indikator (Outer Model)';
                container.innerHTML = `
                    <div style="display:flex; gap:10px;">
                        <div class="form-group" style="flex:1"><label>Peran Konstruk</label>
                        <select id="inp-peran"><option>Eksogen (X)</option><option>Mediasi (Z)</option><option>Endogen (Y)</option></select></div>
                        <div class="form-group" style="flex:1"><label>Kode Item</label><input type="text" id="inp-kode" placeholder="Contoh: PU_1" required></div>
                    </div>
                    <div class="form-group"><label>Nama Konstruk</label><input type="text" id="inp-konstruk" placeholder="Contoh: Perceived Usefulness" required></div>
                    <div class="form-group"><label>Indikator Asli (Dari PDF)</label><textarea id="inp-asli" style="height:70px" placeholder="Paste pernyataan asli jurnal..."></textarea></div>
                    <div class="form-group"><label>Draft Kuesioner (Indo)</label><textarea id="inp-indo" style="height:70px" placeholder="Saya merasa menggunakan sistem ini..."></textarea></div>
                `;
            }
            document.getElementById('modal').style.display = 'flex';
        }

        function closeModal() { document.getElementById('modal').style.display = 'none'; }

        // === SIMPAN & HAPUS DATA JURNAL ===
        function saveData() {
            if (currentTab === 'literatur') {
                const penulis = document.getElementById('inp-penulis').value.trim();
                if(!penulis) return showToast('Penulis tidak boleh kosong!', true);

                db.literatur.unshift({
                    id: Date.now(), 
                    penulis: penulis,
                    variabel: document.getElementById('inp-var').value.trim() || 'Umum',
                    kutipan: document.getElementById('inp-kutipan').value.trim(),
                    ide: document.getElementById('inp-ide').value.trim(),
                    timestamp: new Date().toLocaleString('id-ID')
                });
                
                if(saveToDatabase(DB_KEY_LIT, db.literatur)) showToast('✅ Sintesis Jurnal Tersimpan!');
            } else {
                const kode = document.getElementById('inp-kode').value.trim();
                if(!kode) return showToast('Kode Item wajib diisi!', true);

                db.indikator.unshift({
                    id: Date.now(),
                    peran: document.getElementById('inp-peran').value,
                    kode: kode,
                    konstruk: document.getElementById('inp-konstruk').value.trim(),
                    asli: document.getElementById('inp-asli').value.trim(),
                    indo: document.getElementById('inp-indo').value.trim(),
                    timestamp: new Date().toLocaleString('id-ID')
                });
                
                if(saveToDatabase(DB_KEY_IND, db.indikator)) showToast('✅ Indikator SmartPLS Tersimpan!');
            }
            closeModal();
            renderData();
        }

        function deleteItem(type, id) {
            if(confirm('Yakin mau hapus data ini dari skripsi lu?')) {
                db[type] = db[type].filter(item => item.id !== id);
                const isSaved = saveToDatabase(type === 'literatur' ? DB_KEY_LIT : DB_KEY_IND, db[type]);
                if(isSaved) {
                    renderData();
                    showToast('🗑️ Data berhasil dihapus!');
                }
            }
        }

        // === 🔄 RENDER ENGINE ===
        function renderData() {
            const searchQuery = document.getElementById('searchInput').value.toLowerCase();

            document.getElementById('countLit').innerText = db.literatur.length;
            document.getElementById('countInd').innerText = db.indikator.length;

            // Render Literatur
            const gridLit = document.getElementById('lit-grid');
            const filteredLit = db.literatur.filter(item => 
                (item.penulis && item.penulis.toLowerCase().includes(searchQuery)) || 
                (item.variabel && item.variabel.toLowerCase().includes(searchQuery)) ||
                (item.kutipan && item.kutipan.toLowerCase().includes(searchQuery)) ||
                (item.ide && item.ide.toLowerCase().includes(searchQuery))
            );

            if (filteredLit.length === 0) {
                gridLit.innerHTML = `<p style="color:var(--text-muted); text-align:center; width:100%; grid-column: 1 / -1;">${searchQuery ? 'Pencarian tidak ditemukan 🧐' : 'Belum ada sintesis jurnal. Gas kerjain Bab 2!'}</p>`;
            } else {
                gridLit.innerHTML = filteredLit.map(item => `
                    <div class="data-card">
                        <span class="badge">${item.variabel}</span>
                        <h4>${item.penulis}</h4>
                        ${item.kutipan ? `<div class="quote-box">"${item.kutipan}"</div>` : ''}
                        <p><strong>Ide:</strong> ${item.ide}</p>
                        <div style="display:flex; justify-content:space-between; align-items:center; margin-top:10px;">
                            <span style="font-size:10px; color:var(--border);">${item.timestamp}</span>
                            <button class="btn-danger" onclick="deleteItem('literatur', ${item.id})">Hapus</button>
                        </div>
                    </div>
                `).join('');
            }

            // Render Indikator
            const gridInd = document.getElementById('ind-grid');
            const filteredInd = db.indikator.filter(item => 
                (item.kode && item.kode.toLowerCase().includes(searchQuery)) || 
                (item.konstruk && item.konstruk.toLowerCase().includes(searchQuery)) ||
                (item.indo && item.indo.toLowerCase().includes(searchQuery)) ||
                (item.asli && item.asli.toLowerCase().includes(searchQuery))
            );

            if (filteredInd.length === 0) {
                gridInd.innerHTML = `<p style="color:var(--text-muted); text-align:center; width:100%; grid-column: 1 / -1;">${searchQuery ? 'Pencarian tidak ditemukan 🧐' : 'Belum ada indikator untuk kuesioner.'}</p>`;
            } else {
                gridInd.innerHTML = filteredInd.map(item => `
                    <div class="data-card">
                        <span class="badge">${item.kode}</span>
                        <p style="font-size:12px; margin:0; color:var(--primary); font-weight:bold">${item.peran} • ${item.konstruk}</p>
                        <h4 style="margin-top:5px; padding-right:0;">"${item.indo}"</h4>
                        <p style="font-size:12px">Asli: <i>${item.asli}</i></p>
                        <div style="display:flex; justify-content:space-between; align-items:center; margin-top:10px;">
                            <span style="font-size:10px; color:var(--border);">${item.timestamp}</span>
                            <button class="btn-danger" onclick="deleteItem('indikator', ${item.id})">Hapus</button>
                        </div>
                    </div>
                `).join('');
            }
        }

        // === 📥 EXPORT & RESTORE ===
        function exportCSV() {
            if(db.indikator.length === 0) return showToast('Data indikator kosong!', true);
            let csv = "Peran,Konstruk,Kode Item,Indikator Asli,Kuesioner Indonesia\n";
            db.indikator.forEach(r => {
                const safeAsli = r.asli ? r.asli.replace(/"/g, '""') : '';
                const safeIndo = r.indo ? r.indo.replace(/"/g, '""') : '';
                csv += `"${r.peran}","${r.konstruk}","${r.kode}","${safeAsli}","${safeIndo}"\n`;
            });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
            link.download = "Indikator_SmartPLS_Syla.csv";
            link.click();
        }

        function exportJSON() {
            const link = document.createElement("a");
            link.href = URL.createObjectURL(new Blob([JSON.stringify(db)], { type: 'application/json' }));
            link.download = `Backup_Skripsi_Syla_${new Date().toISOString().slice(0,10)}.json`;
            link.click();
            showToast('💾 Backup berhasil diunduh!');
        }

        function importJSON(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                try {
                    const imported = JSON.parse(event.target.result);
                    if(!imported.literatur && !imported.indikator) throw new Error("Format salah");
                    
                    db.literatur = imported.literatur || []; 
                    db.indikator = imported.indikator || [];
                    db.notes = imported.notes || []; // Import notes juga
                    
                    saveToDatabase(DB_KEY_LIT, db.literatur);
                    saveToDatabase(DB_KEY_IND, db.indikator);
                    saveToDatabase(DB_KEY_NOTES, db.notes);
                    
                    renderNotes();
                    renderData(); 
                    showToast('📂 Restore data sukses!');
                } catch (err) { showToast("❌ File rusak atau bukan file backup!", true); }
                e.target.value = '';
            };
            reader.readAsText(file);
        }

        // Init
        document.querySelector('.fab').style.display = 'none';
        document.getElementById('search-box').style.display = 'none';
        renderNotes();
        renderData();
    </script>
</body>
</html>
