<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Syla's Skripsi Workspace</title>
    <style>
        /* CSS FIX: Pastiin tombol selalu di atas dan nggak ketutup */
        :root { --primary: #4361ee; --bg-body: #f4f7fe; --bg-card: #ffffff; --shadow: 0 4px 6px rgba(0,0,0,0.1); }
        body { margin: 0; padding: 0; background: var(--bg-body); font-family: sans-serif; position: relative; }
        
        /* FIX: Header biar nggak ngalangin elemen di bawahnya */
        .header { background: var(--bg-card); padding: 15px 20px; display: flex; justify-content: space-between; position: relative; z-index: 5; }
        
        /* FIX: Tab Nav biar clickable */
        .nav-tabs { display: flex; gap: 10px; padding: 20px; position: relative; z-index: 5; cursor: pointer; }
        .tab { padding: 10px 20px; background: #eee; border-radius: 8px; }
        .tab.active { background: var(--primary); color: white; }

        /* FIX: Modal biar nggak ngunci layar */
        .modal-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.5); display: none; z-index: 1000; align-items: center; justify-content: center; }
        .modal { background: white; padding: 20px; border-radius: 12px; width: 90%; max-width: 500px; position: relative; }
        
        /* FIX: Grid biar bisa dipencet */
        .item-grid { display: grid; gap: 20px; padding: 20px; position: relative; z-index: 1; }
        .data-card { background: white; padding: 20px; border-radius: 12px; box-shadow: var(--shadow); cursor: pointer; }
        
        button { cursor: pointer; z-index: 1001; }
    </style>
</head>
<body>

    <header class="header">
        <h1>Syla's Workspace</h1>
        <button onclick="toggleTheme()">🌓</button>
    </header>

    <div class="nav-tabs">
        <div class="tab active" onclick="switchTab('dashboard')">📊 Dashboard</div>
        <div class="tab" onclick="switchTab('literatur')">📚 Jurnal</div>
    </div>

    <!-- Section -->
    <div id="dashboard" class="content-section active" style="padding:20px;">
        <h2>Dashboard</h2>
    </div>

    <div id="literatur" class="content-section" style="display:none;">
        <div class="item-grid" id="lit-grid">
            <div class="data-card" onclick="alert('Bisa dipencet!')">
                <h4>Contoh Jurnal</h4>
                <p>Klik aku kalau bisa dipencet!</p>
            </div>
        </div>
    </div>

    <script>
        function switchTab(tab) {
            document.querySelectorAll('.content-section').forEach(el => el.style.display = 'none');
            document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
            document.getElementById(tab).style.display = 'block';
            event.currentTarget.classList.add('active');
        }
        function toggleTheme() { document.documentElement.dataset.theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; }
    </script>
</body>
</html>
